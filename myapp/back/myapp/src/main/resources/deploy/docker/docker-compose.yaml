services:
  mysql:
    image: mysql:8.0
    container_name: myapp-mysql-${APP_ENV:-prod}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-twsny_prod}
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../db/mysql/initial.sql:/docker-entrypoint-initdb.d/initial.sql:ro
    ports:
      - "${MYSQL_PORT:-16011}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../../../../../..
      dockerfile: back/myapp/src/main/resources/deploy/docker/backend.Dockerfile
    container_name: myapp-backend-${APP_ENV:-prod}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-twsny_prod}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/code/image >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  nginx:
    build:
      context: ../../../../../../..
      dockerfile: back/myapp/src/main/resources/deploy/docker/frontend.Dockerfile
    container_name: myapp-nginx-${APP_ENV:-prod}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_UPSTREAM: backend
      DOLLAR: "$$"
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  mysql-data:
    name: myapp-mysql-data-${APP_ENV:-prod}

spring:
  application:
    name: myapp
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

server:
  port: 8080

app:
  jwt:
    # Base64-encoded secret — at least 32 bytes (256 bits) for HS256
    secret: dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1qd3Qtc2lnbmluZw==
    expiration: 86400000   # 1 day in ms
  cors:
    allowed-origins: http://localhost:5173
